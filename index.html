<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- All texts on this page come from lang/en.js and lang/ja.js.
     ?v=4.2.2: the version of the game. Raise it everywhere at once (for example 4.1.2) after a
     change, so browsers fetch the new files instead of mixing them with older ones they keep. -->
<title data-i18n="app.pageTitle"></title>
<meta name="theme-color" content="#F6E8C6">
<!-- App icon and app description for installing the game (icons made by tools/make-icons.js) -->
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="fonts/fonts.css?v=4.2.2">
<link rel="stylesheet" href="css/game.css?v=4.2.2">
</head>
<body>
  <!-- ===== Title screen ===== -->
  <section id="titleScreen" class="screen title-screen">
    <div class="title-card">
      <p class="test-note" data-i18n="title.testNote"></p>
      <h1 class="game-title" data-i18n="title.name"></h1>
      <p class="subtitle" data-i18n="title.subtitle"></p>
      <div class="title-buttons">
        <button type="button" id="continueBtn" class="btn btn-primary" hidden></button>
        <button type="button" id="newGameBtn" class="btn" data-i18n="title.newGame"></button>
        <button type="button" id="notebookBtn" class="btn" data-i18n="title.notebook" hidden></button>
        <button type="button" id="aboutBtn" class="btn btn-small" data-i18n="title.about"></button>
      </div>
      <!-- Sound on or off (text set by js/ui.js) -->
      <button type="button" id="soundBtn" class="btn btn-small sound-btn" aria-pressed="true"></button>
      <!-- Installing and playing offline (js/offline.js) -->
      <button type="button" id="installBtn" class="btn btn-small install-btn" data-i18n="title.install" hidden></button>
      <p id="installHint" class="muted install-note" data-i18n="title.installHint" hidden></p>
      <p id="offlineNote" class="muted install-note" data-i18n="title.offlineReady" hidden></p>
      <form id="nameForm" class="name-form" hidden>
        <label for="nameInput" data-i18n="title.nameLabel"></label>
        <input id="nameInput" maxlength="10" autocomplete="off" spellcheck="false">
        <fieldset class="look-pick">
          <legend data-i18n="title.lookLabel"></legend>
          <!-- The four looks, added by js/ui.js -->
          <div id="lookChoices" class="look-choices"></div>
        </fieldset>
        <p id="overwriteNote" class="muted" data-i18n="title.overwrite" hidden></p>
        <button type="submit" class="btn btn-primary" data-i18n="title.start"></button>
      </form>
      <!-- One button per language file, added by js/ui.js -->
      <nav class="lang-switch" id="langSwitch" data-i18n-aria-label="lang.switchLabel"></nav>
    </div>

    <!-- The village notebook from the title screen: every note found in any game -->
    <div id="titlePanel" class="panel" hidden role="dialog" aria-modal="true" aria-labelledby="titlePanelTitle">
      <div class="panel-box">
        <h2 id="titlePanelTitle" data-i18n="notebook.title"></h2>
        <div id="titlePanelBody" class="panel-body"></div>
        <div class="panel-actions"><button type="button" id="titlePanelClose" class="btn btn-primary" data-i18n="ui.close"></button></div>
      </div>
    </div>
  </section>

  <!-- ===== The game ===== -->
  <section id="gameScreen" class="screen game-screen" hidden>
    <div id="stage" class="stage">
      <canvas id="world" data-i18n-aria-label="game.worldLabel" role="img"></canvas>
    </div>

    <header class="hud">
      <div class="hud-box"><span id="hudDay"></span> <span id="hudTime" class="hud-time"></span> <span id="hudWeather"></span></div>
      <div class="hud-box hud-right"><span id="hudMoney"></span>
        <button type="button" id="mapBtn" class="btn btn-small" data-i18n="ui.map"></button>
        <button type="button" id="menuBtn" class="btn btn-small" data-i18n="ui.menu"></button></div>
    </header>

    <p id="sceneInfo" class="scene-info" aria-live="polite" hidden></p>
    <p id="hint" class="hint" aria-live="polite" hidden></p>
    <button type="button" id="actionBtn" class="action-btn" hidden></button>

    <!-- Conversations -->
    <div id="dialogue" class="dialogue" hidden tabindex="-1" aria-live="polite">
      <div class="dialogue-head"><span id="dlgName" class="dlg-name"></span><span id="dlgHearts" class="hearts"></span></div>
      <p id="dlgText" class="dlg-text"></p>
      <div id="dlgChoices" class="choices"></div>
      <span id="dlgNext" class="dlg-next" aria-hidden="true">▼</span>
    </div>

    <!-- Build mode -->
    <div id="buildBar" class="build-bar" hidden role="region" data-i18n-aria-label="build.title">
      <div class="build-head"><h2 data-i18n="build.title"></h2><p class="muted" data-i18n="build.help"></p></div>
      <div id="buildTools" class="tools"></div>
      <p id="buildInfo" class="build-info"></p>
      <p id="buildProblem" class="build-problem"></p>
      <div class="build-actions">
        <button type="button" id="buildUndo" class="btn btn-small" data-i18n="build.undo"></button>
        <button type="button" id="buildCancel" class="btn btn-small" data-i18n="build.cancel"></button>
        <button type="button" id="buildGo" class="btn btn-small btn-primary" data-i18n="build.go"></button>
      </div>
    </div>

    <!-- Windows: bag, diary, menu, settings, evening summary -->
    <div id="panel" class="panel" hidden role="dialog" aria-modal="true" aria-labelledby="panelTitle">
      <div class="panel-box">
        <h2 id="panelTitle"></h2>
        <div id="panelBody" class="panel-body"></div>
        <div id="panelActions" class="panel-actions"></div>
      </div>
    </div>
  </section>

  <script src="js/i18n.js?v=4.2.2"></script>
  <script src="lang/en.js?v=4.2.2"></script>
  <script src="lang/ja.js?v=4.2.2"></script>
  <script src="lang/ja-readings.js?v=4.2.2"></script>
  <script src="js/furigana.js?v=4.2.2"></script>
  <script src="js/music.js?v=4.2.2"></script>
  <script src="js/sound.js?v=4.2.2"></script>
  <script src="js/sprite-sheet.js?v=4.2.2"></script>
  <script src="js/map-data.js?v=4.2.2"></script>
  <script src="js/game-data.js?v=4.2.2"></script>
  <script src="js/rules.js?v=4.2.2"></script>
  <script src="js/community.js?v=4.2.2"></script>
  <script src="js/festivals.js?v=4.2.2"></script>
  <script src="js/events.js?v=4.2.2"></script>
  <script src="js/notebook.js?v=4.2.2"></script>
  <script src="js/soundscape.js?v=4.2.2"></script>
  <script src="js/save.js?v=4.2.2"></script>
  <script src="js/offline.js?v=4.2.2"></script>
  <script src="js/render.js?v=4.2.2"></script>
  <script src="js/input.js?v=4.2.2"></script>
  <script src="js/world.js?v=4.2.2"></script>
  <script src="js/dialogue.js?v=4.2.2"></script>
  <script src="js/talks.js?v=4.2.2"></script>
  <script src="js/story.js?v=4.2.2"></script>
  <script src="js/scenes.js?v=4.2.2"></script>
  <script src="js/minimap.js?v=4.2.2"></script>
  <script src="js/ui.js?v=4.2.2"></script>
  <script src="js/build.js?v=4.2.2"></script>
  <script src="js/main.js?v=4.2.2"></script>
</body>
</html>
